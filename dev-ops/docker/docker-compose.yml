services:
  mysql:
    image: mysql:8.0
    container_name: hj_mysql
    restart: unless-stopped
    ports:
      - "13398:3306"
    environment:
      MYSQL_ROOT_PASSWORD: deQsa#$@
      MYSQL_DEFAULT_CHARACTER_SET: utf8mb4
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdeQsa#$@"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hj_redis
    restart: unless-stopped
    ports:
      - "16789:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/data:/data
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "fsWds#$%", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
